[package]
name    = "amber-clustering"
version = "0.1.0"
edition = "2021"

# Single binary target — main.rs is the crate root.
# No [lib] section: this eliminates the split-crate problem where
# the binary's `crate::` resolves to lib.rs instead of main.rs.
# Unit tests live inside src/ files under #[cfg(test)].
# Integration tests in tests/ import via `use amber_clustering::...`
# but since there is no lib, they link against the binary — see note
# in tests/clustering_integration_test.rs for the workaround.
[[bin]]
name = "amber-clustering"
path = "src/main.rs"

[dependencies]
tonic        = { version = "0.11", features = ["transport"] }
prost        = "0.12"
tokio        = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
rayon        = "1.10"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.11"