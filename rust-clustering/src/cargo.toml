[package]
name    = "amber-clustering"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "amber-clustering"
path = "src/main.rs"

[dependencies]
# gRPC server
tonic        = { version = "0.11", features = ["transport"] }
prost        = "0.12"
tokio        = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"

# Geospatial
geo          = "0.28"
rstar        = "0.11"   # R*-tree for spatial indexing

# Parallel computation
rayon = "1.10"

# Serialisation
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.11"